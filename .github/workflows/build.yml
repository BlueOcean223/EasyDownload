name: Build desktop applications

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            platform: darwin/universal
            artifact: EasyDownload-macos-universal
            package: EasyDownload-macos-universal.zip
          - name: Windows x64
            runner: windows-latest
            platform: windows/amd64
            artifact: EasyDownload-windows-amd64
            package: EasyDownload-windows-amd64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Wails application
        run: >-
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          build
          -platform "${{ matrix.platform }}"
          -clean
          -s

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/EasyDownload.app "${{ matrix.package }}"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/EasyDownload.exe -DestinationPath "${{ matrix.package }}" -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
